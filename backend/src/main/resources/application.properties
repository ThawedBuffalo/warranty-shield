# Application Configuration
spring.application.name=warranty-shield

# Server
server.port=8080

# Database (H2 for development/testing, PostgreSQL for production)
spring.datasource.url=jdbc:h2:file:./data/warranty;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=YXV0aC1zZWNyZXQtd2FycmFudHktc2hpZWxkLWp3dC1zZWN1cmUta2V5LTIwMjY=
app.jwt.expiration-ms=86400000

