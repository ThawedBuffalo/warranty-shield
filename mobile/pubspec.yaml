name: warranty_shield
description: Warranty Shield - Track and manage your warranties on the go.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.3.0
  pretty_dio_logger: ^1.3.1

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0

  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  cached_network_image: ^3.3.0
  flutter_slidable: ^3.0.1
  shimmer: ^3.0.0

  # Utilities
  uuid: ^4.2.0
  url_launcher: ^6.2.0
  share_plus: ^7.2.0
  file_picker: ^6.1.0
  path_provider: ^2.1.0
  device_info_plus: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/